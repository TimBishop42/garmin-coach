[project]
name = "garmin-coach"
version = "0.1.0"
description = "Adaptive running coach: reads Garmin Connect training data, writes structured workouts to the calendar"
requires-python = ">=3.11"
dependencies = [
    "garminconnect>=0.3.2,<0.4",
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
garmin-login = "garmin_coach.login:main"
garmin-coach-mcp = "garmin_coach.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_coach"]
